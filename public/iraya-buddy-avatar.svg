<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Royal Maroon Radial Gradient -->
    <radialGradient id="buddyBg" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#8a1f32"/>
      <stop offset="65%" stop-color="#721828"/>
      <stop offset="100%" stop-color="#460d17"/>
    </radialGradient>
    
    <!-- Warm Gold Gradient for borders & accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2d0"/>
      <stop offset="35%" stop-color="#e0b258"/>
      <stop offset="70%" stop-color="#c29342"/>
      <stop offset="100%" stop-color="#916c27"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2a060d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Base Circular Shield -->
  <circle cx="100" cy="100" r="94" fill="url(#buddyBg)" filter="url(#badgeShadow)"/>
  
  <!-- Outer Gold Filigree Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.95"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#fcf6f0" stroke-width="0.8" stroke-dasharray="3 2" stroke-opacity="0.6"/>

  <!-- Inner Soft Linen Glow -->
  <circle cx="100" cy="100" r="82" fill="#721828" fill-opacity="0.4"/>

  <!-- Central Palmette Crest from Iraya Logo -->
  <g fill="url(#goldGrad)">
    <path d="M100 34 C100 24 100 20 100 20 C100 20 100 24 100 34 Z"/>
    <path d="M100 22 C101 34 102 46 100 54 C98 46 99 34 100 22 Z"/>
    <path d="M100 22 C105 31 111 43 111 51 C106 51 101 46 100 42 Z"/>
    <path d="M100 22 C95 31 89 43 89 51 C94 51 99 46 100 42 Z"/>
    <circle cx="100" cy="58" r="3.2"/>
    <circle cx="100" cy="68" r="2.4"/>
    <path d="M100 74 C103 79 106 83 106 88 C102 87 101 84 100 81 C99 84 98 87 94 88 C94 83 97 79 100 74 Z"/>
  </g>

