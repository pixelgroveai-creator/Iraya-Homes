  <!-- Bottom Brand Text: IRAYA BUDDY -->
  <text x="100" y="174" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="13" 
    font-weight="700" 
    letter-spacing="3.5" 
    fill="#fdf2d0" 
    text-anchor="middle">
    IRAYA
  </text>
  <text x="100" y="187" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="7.5" 
    font-weight="600" 
    letter-spacing="2" 
    fill="#c29342" 
    text-anchor="middle">
    AI BUDDY
  </text>

  <!-- AI Sparkle Accents -->
  <g fill="url(#goldGrad)">
    <!-- Top-Right Sparkle -->
    <path d="M152 46 Q157 46 157 41 Q157 46 162 46 Q157 46 157 51 Q157 46 152 46 Z"/>
    <circle cx="166" cy="38" r="1.5" fill="#fdf2d0"/>
    <!-- Top-Left Micro Sparkle -->
    <path d="M42 48 Q46 48 46 44 Q46 48 50 48 Q46 48 46 52 Q46 48 42 48 Z"/>
  </g>
</svg>
